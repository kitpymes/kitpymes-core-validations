trigger:
  branches:
    include:
    - master

variables:
  buildConfiguration: 'Release'

parameters:
- name: image
  displayName: Pool Image
  type: string
  default: ubuntu-latest
  values:
  - ubuntu-latest
  - windows-latest(Not working)
  - macOS-latest

- name: runBuild
  displayName: Run Build?
  type: boolean
  default: true

- name: runTest
  displayName: Run Tests?
  type: boolean
  default: true

- name: runDeploy
  displayName: Run Deployment?
  type: boolean
  default: false

- name: publishNuget
  displayName: Publish Nuget?
  type: boolean
  default: false

- name: GenerateRC
  type: boolean
  default: false

- name: RCNumber
  type: number
  default: 1

stages:
- stage: Restore
  displayName: Restore stage
  jobs:
  - job: Restore
    displayName: Restore job
    pool: 
      vmImage: ${{ parameters.image }}
    steps:
    - task: UseDotNet@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.csproj'

- ${{ if eq(parameters.runBuild, true) }}:
  - stage: Build
    displayName: Build stage
    jobs:
    - job: Build
      displayName: Build job
      pool: 
        vmImage: ${{ parameters.image }}
      steps:
      - task: UseDotNet@2
        displayName: 'dotnet build $(buildConfiguration)'
        inputs:
          useGlobalJson: true
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration $(buildConfiguration)'

- ${{ if eq(parameters.runTest, true) }}:
    - stage: Test
      displayName: Test stage
      jobs:
      - job: Test
        displayName: Test job
        pool:
          vmImage: ${{ parameters.image }}
        steps:
        - task: UseDotNet@2
          displayName: Test step
          inputs:
            useGlobalJson: true
            command: test
            projects: '**/*Tests/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

- ${{ if eq(parameters.runDeploy, true) }}:
    - stage: Deploy
      displayName: Deploy stage
      jobs:
      - job: Deploy
        displayName: Deploy job
        dependsOn: Build
        environment: 'development'
        pool:
          vmImage: ${{ parameters.image }}
        steps:
        - script: echo running Deploy
