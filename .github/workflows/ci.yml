name: ci

# Compila y pasa los tests en cada subida, a master o a cualquier rama. El resultado
# aparece en el PR de la rama (que abre solo auto-pr.yml).
# En master, si la versión del proyecto aún no tiene etiqueta (vX.Y.Z), además
# publica en NuGet y crea la etiqueta y la release en GitHub. Fusionar el PR que
# sube la versión es, por tanto, la orden de publicar.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Una subida nueva a la misma rama cancela la ejecución anterior, salvo en master:
# allí no se corta nunca una publicación a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Solution.sln

      # El analizador de hilos no se ejecutaba (Update en vez de Include) y nadie lo vio: se comprueba en
      # cada proyecto que no es de tests que el paquete está referenciado y que VSTHRD110 es un error.
      # Que se ejecuta lo prueba el paso siguiente.
      - name: Comprobar Microsoft.VisualStudio.Threading.Analyzers
        run: |
          for p in $(git ls-files '*.csproj' | grep -vi test); do
            props="-p:Configuration=Debug -p:SolutionDir=$PWD/"
            # Tras restaurar, project.assets.json lista los paquetes que el proyecto referencia de verdad.
            assets="$(dirname "$p")/obj/project.assets.json"
            grep -q '"Microsoft.VisualStudio.Threading.Analyzers/' "$assets" || { echo "::error::$p no referencia Microsoft.VisualStudio.Threading.Analyzers."; exit 1; }
            errores=$(dotnet msbuild "$p" $props -getProperty:WarningsAsErrors)
            echo "$errores" | grep -q 'VSTHRD110' || { echo "$errores"; echo "::error::$p no trata VSTHRD110 como error."; exit 1; }
            echo "$p: Threading.Analyzers referenciado y VSTHRD110 como error."
          done

      # Prueba de que el analizador de hilos se ejecuta de verdad (no sólo que está referenciado):
      # un fichero temporal con una Task descartada en un método síncrono tiene que dar "error VSTHRD110",
      # con TreatWarningsAsErrors y MSBuildTreatWarningsAsErrors activos y desactivados. Common.Build.props pone
      # MSBuildTreatWarningsAsErrors=true en Debug, que convierte todos los avisos en errores: si no se desactiva
      # también, la vuelta "false" no prueba que VSTHRD110 sea error por sí solo.
      # La salida de dotnet no se muestra si todo va bien: sus "error VSTHRD110" saldrían como anotaciones de error.
      - name: Prueba de que VSTHRD110 para la compilación
        run: |
          p=$(git ls-files '*.csproj' | grep -vi test | head -n 1)
          f="$(dirname "$p")/ComprobacionVsthrd110.cs"
          printf 'namespace Kitpymes.Comprobacion\n{\n    internal static class ComprobacionVsthrd110\n    {\n        internal static void Descartar() { System.Threading.Tasks.Task.Delay(1); }\n    }\n}\n' > "$f"
          for twae in true false; do
            if dotnet build "$p" --no-restore -c Debug -p:SolutionDir="$PWD/" -p:TreatWarningsAsErrors=$twae -p:MSBuildTreatWarningsAsErrors=$twae > vsthrd110.log 2>&1; then
              rm "$f"; echo "::error::$p compila con una Task descartada (TreatWarningsAsErrors=$twae): VSTHRD110 no para la compilación."; exit 1
            fi
            if ! grep -q 'error VSTHRD110' vsthrd110.log; then
              rm "$f"; sed 's/error/fallo/g' vsthrd110.log; echo "::error::La compilación falló, pero no por error VSTHRD110 (TreatWarningsAsErrors=$twae)."; exit 1
            fi
            echo "$p: error VSTHRD110 con TreatWarningsAsErrors=$twae."
          done
          rm "$f"

      # En Debug: algunos tests de ficheros y zip sólo se compilan en Debug (#if DEBUG).
      - name: Compilar
        run: dotnet build Solution.sln --no-restore -c Debug

      - name: Tests
        run: dotnet test Solution.sln --no-build -c Debug --collect:"XPlat Code Coverage" --results-directory cobertura

      # Muestra el porcentaje de líneas cubiertas por los tests (informativo: no para la pipeline).
      - name: Cobertura
        run: |
          f=$(find cobertura -name coverage.cobertura.xml | head -n 1)
          if [ -z "$f" ]; then echo "::warning::No se generó el informe de cobertura."; exit 0; fi
          rate=$(grep -o 'line-rate="[0-9.]*"' "$f" | head -n 1 | grep -o '[0-9.]*')
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "Cobertura de líneas: $pct %"
          echo "### Cobertura de líneas: $pct %" >> "$GITHUB_STEP_SUMMARY"

      # Empaqueta igual que el job publish, para ver en la rama que la publicación no fallará al empaquetar.
      # Tiene que salir un .nupkg por cada librería.
      - name: Empaquetar como en la publicación
        run: |
          n=0
          for p in $(git ls-files 'Kitpymes.*.csproj' | grep -v Tests); do
            dotnet pack "$p" -c Release -o artifacts-prueba
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::No se ha encontrado ninguna librería que empaquetar."; exit 1
          fi
          hechos=$(ls artifacts-prueba/*.nupkg | wc -l)
          if [ "$hechos" -ne "$n" ]; then
            echo "::error::Salen $hechos paquetes y hay $n librerías."; exit 1
          fi
          ls artifacts-prueba

  # En cada rama, tests de mutación con Stryker.NET: mide si los tests detectan fallos metidos
  # a propósito. Un mutante que sobrevive es un test que falta. La puntuación sale en el resumen.
  # Se muta cada proyecto que tiene su proyecto de tests al lado (Kitpymes.X -> Kitpymes.X.Tests).
  mutation:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Stryker.NET
        run: dotnet tool install -g dotnet-stryker --version 5.1.0

      - name: Mutación
        run: |
          for t in $(git ls-files 'Kitpymes.*.Tests/*.Tests.csproj'); do
            src=$(basename "$t" .Tests.csproj)
            [ -f "$src/$src.csproj" ] || continue
            (cd "$(dirname "$t")" && dotnet stryker --project "$src.csproj" --reporter markdown --reporter json --reporter progress --output "../mutacion/$src") || exit 1
          done

      - name: Resumen
        if: always()
        run: find mutacion -name '*.md' -exec cat {} + | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Mutantes vivos
        if: always()
        shell: python
        run: |
          import glob, json, os
          for f in glob.glob("mutacion/**/mutation-report.json", recursive=True):
              data = json.load(open(f, encoding="utf-8"))
              for name, file in data["files"].items():
                  lines = file["source"].split("\n")
                  for m in file["mutants"]:
                      if m["status"] in ("Survived", "NoCoverage"):
                          line = m["location"]["start"]["line"]
                          print(f"{m['status']}: {os.path.basename(name)}:{line} {m['mutatorName']} -> {m.get('replacement', '')!r} | {lines[line - 1].strip()}")

  # En cada rama (lo que luego es un PR) comprueba que nuget.org confía en este repo
  # (política de Trusted Publishing). Sin ella, fusionar un cambio de versión fallaría al
  # publicar; así se ve antes de fusionar. No publica nada: pide una clave temporal y la descarta.
  nuget-policy:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Comprobar la política de NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: kitpymes

      - name: Avisar si falta la política
        if: failure()
        run: |
          echo "::error::Falta la política de Trusted Publishing de este repo en nuget.org (cuenta Kitpymes): owner kitpymes, repositorio ${{ github.event.repository.name }}, workflow ci.yml, sin entorno. Sin ella no se puede publicar."
          exit 1

  publish:
    # Sólo en master y sólo si los tests han pasado.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la etiqueta y la release
      id-token: write   # Trusted Publishing: nuget.org da una clave temporal sin guardar ninguna aquí
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ver si esta versión ya está publicada
        id: version
        run: |
          version=$(dotnet msbuild Kitpymes.Core.Validations/Kitpymes.Core.Validations.csproj -getProperty:Version -p:Configuration=Release -p:SolutionDir=$PWD/)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "La versión $version ya tiene etiqueta: no hay nada que publicar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sacar las notas de esta versión
        if: steps.version.outputs.publicar == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          primera=$(head -n 1 docs/RELEASE_NOTES.txt | tr -d '\r')
          if [ "$primera" != "# v.$version" ]; then
            echo "Las release notes empiezan por '$primera' y deberían empezar por '# v.$version'. No se publica."
            exit 1
          fi
          awk 'NR > 1 && /^# v\./ { exit } NR > 1' docs/RELEASE_NOTES.txt | tr -d '\r' > notas.md

      - name: Empaquetar
        if: steps.version.outputs.publicar == 'true'
        # Sólo las librerías, no la solución: con la solución, el proyecto web de pruebas tests/Tests.Api
        # fallaba con "packaging has been disabled" y no se publicaba nada.
        run: |
          for p in $(git ls-files 'Kitpymes.*.csproj' | grep -v Tests); do
            dotnet pack "$p" -c Release -o artifacts
          done

      - name: Iniciar sesión en NuGet (clave temporal de 1 hora)
        if: steps.version.outputs.publicar == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: kitpymes

      - name: Publicar en NuGet
        if: steps.version.outputs.publicar == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Después de NuGet: si algo falla antes, no queda una release de un paquete que no existe.
      - name: Crear etiqueta y release en GitHub
        if: steps.version.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notas.md
