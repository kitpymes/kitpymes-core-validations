name: auto-merge

# Fusiona solo el PR de una rama cuando su ci termina en verde (todos los jobs, y los de JOBS_EN_VERDE sin omitir),
# con "Rebase and merge". Así la fusión no depende de que alguien esté delante.
#
# No fusiona:
# - un PR que no abrió auto-pr.yml (autor github-actions[bot]);
# - un PR cuya rama no es de este repo (un fork): workflow_run ve los secretos aunque el código venga de
#   fuera, y el repo es público. Además el job sólo corre si la ejecución de ci es de un push a este repo;
# - un PR cuya cabeza ya no es el commit que pasó la ci (llegó otro commit: decide su propia ci);
# - un PR con la etiqueta espera-sebastian;
# - un PR en borrador;
# - un PR que cambia la versión mayor en Pack.Build.props respecto a su punto de partida en master: esas las
#   fusiona Sebastián, y deja un comentario. Tampoco uno que toque <Version> o <VersionPrefix> en otro fichero.
#
# Si la ci termina antes de que auto-pr.yml abra el PR, no hay PR y no se fusiona: hay que relanzar la ci.
#
# Fusiona con el secreto AUTOMERGE_TOKEN (token de Sebastián), no con github.token: un push hecho con
# github.token no lanza otros workflows, y el push a master tiene que lanzar ci para publicar.
# Si el token falta, caduca o no tiene permisos, o GitHub rechaza la fusión (conflicto al hacer rebase,
# una regla de la rama), el job falla en rojo y deja en el PR un comentario con la respuesta de GitHub.
# Si la cabeza del PR cambió entre la decisión y la fusión (409), no es un fallo: decide la ci del commit nuevo.
#
# workflow_run usa siempre la versión de este fichero que hay en master, no la de la rama.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write   # sólo para comentar en el PR con github.token
  issues: write          # los comentarios de un PR van por la API de issues

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fusionar:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      RAMA: ${{ github.event.workflow_run.head_branch }}
      SHA_CI: ${{ github.event.workflow_run.head_sha }}
      RUN_CI: ${{ github.event.workflow_run.id }}
      RESULTADO_CI: ${{ github.event.workflow_run.conclusion }}
      ESTA_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Jobs de ci que tienen que estar en verde de verdad (no omitidos). Cambia según el repo.
      JOBS_EN_VERDE: build-test mutation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decidir si se fusiona
        id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          no() { echo "No se fusiona: $1"; echo "fusionar=false" >> "$GITHUB_OUTPUT"; exit 0; }

          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=master -f head="${REPO%%/*}:$RAMA" --jq '.[0] // empty')
          [ -n "$pr" ] || no "la rama $RAMA no tiene un PR abierto contra master."
          numero=$(jq -r '.number' <<< "$pr")
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

          [ "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$REPO" ] || no "la rama del PR #$numero no es de este repo."
          [ "$(jq -r '.user.login' <<< "$pr")" = "github-actions[bot]" ] || no "el PR #$numero no lo abrió auto-pr.yml."
          [ "$(jq -r '.draft' <<< "$pr")" = "false" ] || no "el PR #$numero es un borrador."
          [ "$RESULTADO_CI" = "success" ] || no "la ci del PR #$numero terminó en '$RESULTADO_CI'."
          [ "$(jq -r '.head.sha' <<< "$pr")" = "$SHA_CI" ] || no "el PR #$numero tiene commits más nuevos que el que pasó la ci."
          jq -e '.labels | map(.name) | index("espera-sebastian")' <<< "$pr" > /dev/null && no "el PR #$numero tiene la etiqueta espera-sebastian."

          # Todos los jobs de la ci en verde u omitidos, y los de JOBS_EN_VERDE en verde de verdad.
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_CI/jobs?per_page=100")
          malos=$(jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join(", ")' <<< "$jobs")
          [ -z "$malos" ] || no "jobs de la ci sin verde: $malos."
          read -r -a obligatorios <<< "$JOBS_EN_VERDE"
          [ "${#obligatorios[@]}" -gt 0 ] || { echo "::error::JOBS_EN_VERDE está vacío."; exit 1; }
          for j in "${obligatorios[@]}"; do
            [ "$(jq -r --arg j "$j" '[.jobs[] | select(.name == $j and .conclusion == "success")] | length' <<< "$jobs")" = "1" ] \
              || no "el job $j no está en verde."
          done

          # Versión: se compara con el punto de partida de la rama en master, no con master de ahora
          # (una rama anterior a una subida de mayor en master no la "baja"). La mayor la fusiona Sebastián.
          git fetch -q origin "$SHA_CI"
          base=$(git merge-base origin/master "$SHA_CI")
          props=docs/props/Pack.Build.props
          otros=$(git diff --name-only "$base" "$SHA_CI" -- '*.props' '*.targets' '*.csproj' \
            | grep -vxF "$props" \
            | while read -r f; do
                git diff "$base" "$SHA_CI" -- "$f" | grep -qE '^[+-].*<(Version|VersionPrefix)>' && echo "$f"
              done || true)
          [ -z "$otros" ] || no "el PR #$numero cambia <Version> fuera de $props: $(tr '\n' ' ' <<< "$otros")."
          version() { grep -oP '(?<=<Version>)[^<]+' <<< "$1" | head -n 1; }
          antes=$(version "$(git show "$base:$props")")
          despues=$(version "$(git show "$SHA_CI:$props")")
          if [ "${despues%%.*}" != "${antes%%.*}" ]; then
            marca="<!-- auto-merge:version-mayor -->"
            if ! gh api --paginate "repos/$REPO/issues/$numero/comments" --jq '.[].body' | grep -qF "$marca"; then
              gh pr comment "$numero" --repo "$REPO" --body "$marca
          Este PR cambia la versión mayor ($antes → $despues): no se fusiona solo. Lo fusiona Sebastián."
            fi
            no "el PR #$numero cambia la versión mayor ($antes → $despues)."
          fi

          echo "Se fusiona el PR #$numero ($SHA_CI, versión $antes → $despues)."
          echo "fusionar=true" >> "$GITHUB_OUTPUT"

      - name: Fusionar
        if: steps.decidir.outputs.fusionar == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          NUMERO: ${{ steps.decidir.outputs.numero }}
        run: |
          set -euo pipefail
          respuesta="$RUNNER_TEMP/respuesta-fusion.txt"
          if [ -z "$GH_TOKEN" ]; then
            echo "Falta el secreto AUTOMERGE_TOKEN en este repo." | tee "$respuesta"
            exit 1
          fi

          # La etiqueta pudo ponerse mientras se decidía: se vuelve a mirar justo antes.
          if ! etiquetas=$(gh api "repos/$REPO/pulls/$NUMERO" --jq '[.labels[].name] | join(",")' 2>"$respuesta"); then
            cat "$respuesta"; exit 1
          fi
          if [[ ",$etiquetas," == *",espera-sebastian,"* ]]; then
            echo "No se fusiona: el PR #$NUMERO tiene ahora la etiqueta espera-sebastian."
            exit 0
          fi

          if gh api -X PUT "repos/$REPO/pulls/$NUMERO/merge" \
               -f merge_method=rebase -f sha="$SHA_CI" --jq '.message' > "$respuesta" 2>&1; then
            cat "$respuesta"
            exit 0
          fi
          cat "$respuesta"
          if grep -q 'HTTP 409' "$respuesta"; then
            echo "No se fusiona: la cabeza del PR #$NUMERO cambió; decide la ci del commit nuevo."
            exit 0
          fi
          exit 1

      - name: Avisar en el PR si no se pudo fusionar
        if: failure() && steps.decidir.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.decidir.outputs.numero }}
        run: |
          respuesta="$RUNNER_TEMP/respuesta-fusion.txt"
          if [ -s "$respuesta" ]; then
            detalle=$(head -c 1500 "$respuesta")
          else
            detalle="Falló el paso que decide si se fusiona, antes de intentar la fusión: ver la ejecución."
          fi
          case "$detalle" in
            *"HTTP 401"*|*"Falta el secreto"*|*"Bad credentials"*) causa="El token falta, ha caducado o no vale: hay que crear uno nuevo y guardarlo en el secreto AUTOMERGE_TOKEN." ;;
            *"HTTP 403"*|*"HTTP 404"*) causa="El token no tiene permisos sobre este repo (o una regla de la rama lo impide)." ;;
            *"Falló el paso"*) causa="La decisión falló (una llamada a la API o a git): no es cosa del token." ;;
            *) causa="GitHub ha rechazado la fusión (conflicto al hacer rebase, una regla de la rama u otro motivo): ver la respuesta." ;;
          esac
          gh pr comment "$NUMERO" --repo "$REPO" --body "La fusión automática ha fallado: $ESTA_EJECUCION

          $causa Mientras, este PR se fusiona a mano.

          Respuesta de GitHub:
          \`\`\`
          $detalle
          \`\`\`"
